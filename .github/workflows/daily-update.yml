name: Daily Data Update

on:
  schedule:
    - cron: "20 0 * * 1-5"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/*.py"
      - "scripts/requirements.txt"

concurrency:
  group: dividend-data-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Get source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install data dependencies
        run: python -m pip install -r scripts/requirements.txt

      - name: Run update script
        env:
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
        run: python scripts/update_data.py

      - name: Save updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stocks.json data/kospi200.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update stock data"
          git fetch origin main
          if ! git rebase origin/main; then
            git rebase --abort
            echo "::error::Concurrent data change; rerun on latest main"
            exit 1
          fi
          git push origin HEAD:main
